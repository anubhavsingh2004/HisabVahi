{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-4">{{ 'Edit Party' if edit_mode else 'Add Party' }}</h1>
                <form method="post" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Name *</label>
                        <input type="text" name="name" class="form-control" required maxlength="120"
                               value="{{ form_data.get('name', '') if form_data else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="tel" name="phone" class="form-control" maxlength="20" inputmode="tel"
                               value="{{ form_data.get('phone', '') if form_data else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Party Type *</label>
                        <select name="party_type" class="form-select" required>
                            {% set current_type = form_data.get('party_type', 'other') if form_data else 'other' %}
                            {% for ptype in party_types %}
                            <option value="{{ ptype }}" {% if current_type == ptype %}selected{% endif %}>{{ ptype.title() }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea name="notes" class="form-control" rows="3" maxlength="500">{{ form_data.get('notes', '') if form_data else '' }}</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">{{ 'Update Party' if edit_mode else 'Add Party' }}</button>
                        <a href="{{ url_for('parties') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
