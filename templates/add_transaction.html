{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-4">{{ 'Edit Transaction' if edit_mode else 'Add Transaction' }}</h1>
                <form method="post" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Date *</label>
                            <input type="date" name="date" class="form-control" required
                                   value="{{ form_data.get('date', '') if form_data else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Amount *</label>
                            <input type="number" name="amount" class="form-control" step="0.01" min="0.01" required
                                   value="{{ form_data.get('amount', '') if form_data else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Transaction Type *</label>
                            {% set current_type = form_data.get('transaction_type', '') if form_data else '' %}
                            <select name="transaction_type" class="form-select" required>
                                <option value="">Select Type</option>
                                {% for key, label in transaction_types.items() %}
                                <option value="{{ key }}" {% if current_type == key %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Party (optional)</label>
                            {% set current_party = form_data.get('party_id', '') if form_data else '' %}
                            <select name="party_id" class="form-select">
                                <option value="">No Party</option>
                                {% for party in parties %}
                                <option value="{{ party.id }}" {% if current_party|string == party.id|string %}selected{% endif %}>{{ party.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="3">{{ form_data.get('description', '') if form_data else '' }}</textarea>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-success">{{ 'Update Transaction' if edit_mode else 'Add Transaction' }}</button>
                        <a href="{{ url_for('transactions') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
